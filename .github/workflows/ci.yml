name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test with coverage
        run: pytest

      - name: CLI smoke test
        run: agenttelemetry version

      - name: Build package
        run: python -m build

      - name: AgentTelemetry fixture CI loop
        run: |
          set +e
          agenttelemetry ci examples/langgraph_apps/customer_support/app.py:graph \
            --config examples/langgraph_apps/customer_support/tests.yaml \
            --out-dir runs/customer-support \
            --severity-threshold high
          exit_code=$?
          set -e
          test "$exit_code" -eq 1

      - name: Upload AgentTelemetry report
        uses: actions/upload-artifact@v4
        with:
          name: agenttelemetry-customer-support-report-${{ matrix.python-version }}
          path: runs/customer-support/report.html
