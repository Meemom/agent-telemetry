[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Security and observability toolkit for LangGraph agentic systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AgentTelemetry Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "rich>=13.7,<14",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "langgraph>=0.2,<0.4",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
agenttelemetry = "agenttelemetry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttelemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=agenttelemetry --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agenttelemetry"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
